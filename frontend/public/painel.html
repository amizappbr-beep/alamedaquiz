<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Torres Engenharia · Painel CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f6f4ee;
      color: #1f2233;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border: 1px solid #e6e2d8;
      border-radius: 28px;
      padding: 32px;
      box-shadow: 0 20px 60px -30px rgba(100,113,162,0.35);
    }
    .brand-row { display: flex; align-items: center; gap: 12px; }
    .lock {
      width: 44px; height: 44px;
      background: #6471a2; color: #fff;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .kicker { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: #7a7e95; }
    .brand-name { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 600; }
    h1 { font-family: 'Playfair Display', serif; font-size: 26px; margin: 28px 0 6px; font-weight: 600; }
    p.subtitle { color: #7a7e95; font-size: 14px; margin: 0 0 22px; }
    label {
      display: block; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
      color: #7a7e95; margin-bottom: 6px; font-weight: 500;
    }
    input {
      width: 100%; padding: 12px 14px; font-size: 16px;
      background: #fff; border: 1px solid #e6e2d8; border-radius: 12px;
      outline: none; transition: all .15s; font-family: inherit;
    }
    input:focus { border-color: #6471a2; box-shadow: 0 0 0 3px rgba(100,113,162,0.15); }
    .field + .field { margin-top: 14px; }
    .err {
      background: #fff1f1; border: 1px solid #fecaca; color: #b91c1c;
      padding: 10px 14px; border-radius: 12px; font-size: 13px; margin-top: 14px;
      display: none;
    }
    .err.show { display: block; }
    button.submit {
      width: 100%; margin-top: 18px;
      padding: 13px; font-size: 15px; font-weight: 600;
      background: #6471a2; color: #fff;
      border: none; border-radius: 999px; cursor: pointer;
      transition: all .15s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-family: inherit;
    }
    button.submit:hover { background: #555f8b; }
    button.submit:disabled { opacity: 0.6; cursor: wait; }
    .footer-note {
      margin-top: 16px; text-align: center; font-size: 12px; color: #7a7e95;
    }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      display: none;
    }
    .submitting .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card" data-testid="painel-static-card">
    <div class="brand-row">
      <div class="lock" aria-hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <div>
        <div class="kicker">Torres Engenharia</div>
        <div class="brand-name">Painel CRM</div>
      </div>
    </div>

    <h1>Acesse seu painel</h1>
    <p class="subtitle">Versão de acesso direto — funciona mesmo se o navegador estiver com cache desatualizado.</p>

    <form id="login-form" autocomplete="on">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" name="email" required autofocus autocomplete="email" data-testid="painel-static-email" />
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input id="password" type="password" name="password" required autocomplete="current-password" data-testid="painel-static-password" />
      </div>
      <div id="err" class="err" data-testid="painel-static-error"></div>
      <button type="submit" class="submit" id="submit-btn" data-testid="painel-static-submit">
        <span class="spinner"></span>
        <span class="label">Entrar</span>
      </button>
    </form>

    <div class="footer-note">Acesso restrito · Torres Engenharia</div>
  </div>

  <script>
    (function(){
      var form = document.getElementById('login-form');
      var btn = document.getElementById('submit-btn');
      var errEl = document.getElementById('err');
      var btnLabel = btn.querySelector('.label');

      // Build API base from current origin (works in any environment)
      var API = window.location.origin + '/api';
      var TOKEN_KEY = 'alameda500_admin_token_v1';

      form.addEventListener('submit', async function(ev){
        ev.preventDefault();
        errEl.classList.remove('show');
        btn.disabled = true;
        btn.classList.add('submitting');
        btnLabel.textContent = 'Entrando…';

        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;
        try {
          var res = await fetch(API + '/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: password })
          });
          var data = await res.json();
          if (!res.ok) {
            throw new Error(data.detail || 'Erro ao fazer login.');
          }
          localStorage.setItem(TOKEN_KEY, data.access_token);
          // Redirect to /admin with cache-buster so the React bundle reloads fresh
          window.location.replace('/admin?_v=' + Date.now());
        } catch (err) {
          errEl.textContent = err.message || 'Erro ao fazer login.';
          errEl.classList.add('show');
          btn.disabled = false;
          btn.classList.remove('submitting');
          btnLabel.textContent = 'Entrar';
        }
      });
    })();
  </script>
</body>
</html>
